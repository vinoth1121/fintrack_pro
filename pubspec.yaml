name: fintrack_pro
description: FinTrack Pro — AI-powered personal finance management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.0
  flutter_riverpod: ^2.4.0
  go_router: ^14.0.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.0.0
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.0
  dio: ^5.0.0
  dartz: ^0.10.1
  equatable: ^2.0.0
  intl: ^0.20.0
  flutter_animate: ^4.0.0
  fl_chart: ^0.69.0
  path_provider: ^2.0.0
  pdf: ^3.0.0
  image_picker: ^1.0.0
  permission_handler: ^11.0.0
  url_launcher: ^6.0.0
  collection: ^1.0.0
  google_fonts: ^6.0.0
  share_plus: ^13.0.0
  package_info_plus: ^10.0.0
  uuid: ^4.0.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
